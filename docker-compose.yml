version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitepilot-postgres
    environment:
      POSTGRES_USER: sitepilot
      POSTGRES_PASSWORD: sitepilot
      POSTGRES_DB: sitepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepilot -d sitepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sitepilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
